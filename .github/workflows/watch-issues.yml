name: Watch new issues

on:
  schedule:
    - cron: "17 * * * *"   # ב-17 דקות אחרי כל שעה, לא בשעה עגולה
  workflow_dispatch:        # מאפשר הרצה ידנית מהטאב Actions

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests google-genai

      - run: python scripts/check_issues.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}

      - name: Commit seen_issues.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_issues.json
          git diff --staged --quiet || git commit -m "update seen issues"
          git push
